<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Calendar Generator</title>
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <div class="container">
    <h1>Monthly Calendar Generator</h1>

    <div class="form">
      <div class="field">
        <label for="year">Year</label>
        <input type="number" id="year" placeholder="e.g. 2026" min="1" max="9999">
      </div>

      <div class="field">
        <label for="month">Month</label>
        <select id="month">
          <option value="">-- Select --</option>
          <option value="0">January</option>
          <option value="1">February</option>
          <option value="2">March</option>
          <option value="3">April</option>
          <option value="4">May</option>
          <option value="5">June</option>
          <option value="6">July</option>
          <option value="7">August</option>
          <option value="8">September</option>
          <option value="9">October</option>
          <option value="10">November</option>
          <option value="11">December</option>
        </select>
      </div>

      <div class="buttons">
        <button type="button" id="generateBtn">Generate Calendar</button>
        <button type="button" id="resetBtn" class="secondary">Reset</button>
      </div>
    </div>

    <p id="message"></p>

    <div id="calendar"></div>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
